# ── Font ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Propo
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Cursor ────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0

# ── Window ────────────────────────────────────────────
window_padding_width  5
hide_window_decorations yes
background_opacity    0.90
dynamic_background_opacity yes

# ── Gruvbox Dark Colors ────────────────────────────────
# backgrounds
background            #1d2021
foreground            #ebdbb2

# black
color0  #282828
color8  #928374

# red
color1  #cc241d
color9  #fb4934

# green
color2  #98971a
color10 #b8bb26

# yellow
color3  #d79921
color11 #fabd2f

# blue
color4  #458588
color12 #83a598

# magenta / purple
color5  #b16286
color13 #d3869b

# cyan / aqua
color6  #689d6a
color14 #8ec07c

# white
color7  #a89984
color15 #ebdbb2

# selection
selection_background  #504945
selection_foreground  #ebdbb2

# ── URL ───────────────────────────────────────────────
url_color             #83a598
url_style             single

# ── Tab bar (if you use tabs) ─────────────────────────
tab_bar_style                 powerline
tab_powerline_style           round
tab_bar_background            #1d2021
active_tab_background         #458588
active_tab_foreground         #1d2021
inactive_tab_background       #282828
inactive_tab_foreground       #928374
active_tab_font_style         regular

# ── Misc ──────────────────────────────────────────────
enable_audio_bell    no
strip_trailing_spaces smart

# ── Vim keybindings (scrollback) ──────────────────────
scrollback_pager nvim -c "set ft=man" -
map ctrl+shift+h  show_scrollback

# ── Clipboard ─────────────────────────────────────────
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select    yes
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard


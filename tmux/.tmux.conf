# ── core ─────────────────────────────────────────────
set -g default-shell "/usr/bin/zsh"
set -g default-command "zsh"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000
set -g mouse on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#T"

# ── TPM bootstrap (auto-clone if missing) ────────────
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Plugis 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect Keybinding
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# ── true color ───────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── prefix: Ctrl+Space ───────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── reload config ────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ── splits ───────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── pane navigation (vim) ────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── pane resize ──────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── window navigation ────────────────────────────────
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind Tab last-window

# ── kill ─────────────────────────────────────────────
bind q kill-pane
bind Q kill-window
bind d detach-client

# ── copy mode (vi) ───────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"

# paste
bind p run "wl-paste | tmux load-buffer - && tmux paste-buffer"

# Status Bar
set -g status-style "bg=#1d2021,fg=#928374"
set -g status-left " #[fg=#458588,bold]#S #[fg=#3c3836]│ "
set -g status-left-length 20
set -g status-right "#[fg=#665c54] %H:%M "
set -g status-right-length 20
set -g status-justify left
set -g window-status-format "#[fg=#665c54] #I #W "
set -g window-status-current-format "#[fg=#ebdbb2,bold] #I #W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#458588"
set -g message-style "bg=#282828,fg=#d79921"
set -g mode-style "bg=#458588,fg=#1d2021"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
